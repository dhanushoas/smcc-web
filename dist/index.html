  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="SMCC LIVE - Professional-grade live cricket scoring and real-time match updates for SMCC LIVE." />
  <meta name="keywords" content="SMCC, Cricket, Live Scores, SMCC LIVE, Cricket Council, Scorecard" />
  <meta name="author" content="Dhanush Thangaraj" />
  <title>SMCC LIVE | Professional Cricket Scoring</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=JetBrains+Mono:wght@100..800&display=swap"
    rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script type="module" crossorigin src="/assets/index-CbXq0iSR.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-7D7rWCf5.css">
</head>

<body>
  <div id="root">
    <div
      style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #032333; color: white; font-family: 'Outfit', sans-serif;">
      <img src="/logo.png" alt="SMCC"
        style="height: 80px; width: 80px; border-radius: 50%; margin-bottom: 20px; animation: smcc-pulse 2s infinite; box-shadow: 0 0 20px rgba(255,255,255,0.2);">
      <h2 style="font-weight: 900; letter-spacing: 4px; margin: 0;">SMCC LIVE</h2>
      <p style="font-size: 10px; opacity: 0.5; letter-spacing: 2px; margin-top: 5px; text-transform: uppercase;">
        Professional Cricket Scoring</p>
      <div
        style="width: 30px; height: 30px; border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #00D1FF; border-radius: 50%; animation: smcc-spin 1s linear infinite; margin-top: 30px;">
      </div>
      <style>
        @keyframes smcc-spin {
          0% {
            transform: rotate(0deg);
          }

          100% {
            transform: rotate(360deg);
          }
        }

        @keyframes smcc-pulse {

          0%,
          100% {
            transform: scale(1);
            opacity: 1;
          }

          50% {
            transform: scale(1.05);
            opacity: 0.9;
          }
        }
      </style>
    </div>
  </div>
</body>
